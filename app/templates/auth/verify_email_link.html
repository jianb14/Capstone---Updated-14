{% load static %}
<!doctype html>
<html lang="en">
<head>
{% include 'components/favicon.html' %}
{% include 'components/skeleton_assets.html' %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <title>Confirm Email | Balloorina</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/page_background.css' %}?v=20261026a">
    <script src="{% static 'js/theme-toggle.js' %}"></script>
</head>
<body><main class="body"><div data-skeleton-page data-skeleton-variant="form" class="auth-container">
    <div class="logo-container"><img src="{% static 'images/BalloorinaLogo1.png' %}" alt="Balloorina"></div>
    <p class="info-text">Confirm your email address to finish creating your account.</p>
    <form method="post">{% csrf_token %}<button type="submit">Confirm Email</button></form>
    <p class="bottom-text"><a href="{% url 'login' %}">Back to Login</a></p>
</div></main></body>
</html>
