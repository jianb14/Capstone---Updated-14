{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Balloorina | Analytics Report</title>
    <style>
        @page {
            size: A4;
            margin: 1.4cm 1.2cm 1.9cm 1.2cm;
            @frame footer_frame {
                -pdf-frame-content: footerContent;
                bottom: 0.7cm;
                margin-left: 1.2cm;
                margin-right: 1.2cm;
                height: 0.9cm;
            }
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #232323;
            font-size: 10px;
            line-height: 1.45;
        }

        /* ================= Header ================= */
        .header-table {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .header-table td {
            border: none;
            padding: 0;
            vertical-align: bottom;
        }

        .brand-cell { width: 60%; }
        .confidential-cell { text-align: right; }

        .confidential-stamp {
            border: 1px solid #969696;
            color: #737373;
            font-size: 7.5px;
            font-weight: bold;
            padding: 3px 8px;
        }

        .title-block {
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .title-block h1 {
            font-size: 12px;
            font-weight: bold;
            margin: 8px 0 2px;
            padding: 0;
        }

        .title-block p {
            font-size: 9.5px;
            color: #707070;
            margin: 0;
            padding: 0;
            padding-bottom: 7px;
            border-bottom: 1.5px solid #242424;
        }

        /* ============ Report metadata ============= */
        .meta-table {
            width: 100%;
            margin-bottom: 12px;
        }

        .meta-table td {
            font-size: 9.5px;
            padding: 3px 10px;
            border: none;
        }

        /* Pantay sa kaliwang gilid gaya ng mga heading */
        .meta-table td:first-child {
            padding-left: 0;
        }

        .meta-label {
            color: #737373;
            font-size: 8px;
            font-weight: bold;
            width: 18%;
        }

        .meta-value { width: 32%; }

        /* ============ Section headings ============ */
        h2 {
            font-size: 10.5px;
            font-weight: bold;
            color: #242424;
            margin: 12px 0 6px;
            padding: 0;
            -pdf-keep-with-next: true;
        }

        /* ============== Data tables =============== */
        table.data {
            width: 100%;
            margin-bottom: 8px;
        }

        table.data th {
            color: #404040;
            background-color: #f3f3f3;
            border-bottom: 0.6px solid #d7d7d7;
            font-size: 8.5px;
            font-weight: bold;
            text-align: left;
            padding: 3px 10px;
        }

        table.data th.r { text-align: right; }

        table.data td {
            padding: 2px 10px;
            font-size: 9.5px;
            line-height: 1.3;
            color: #262626;
            border-bottom: 0.5px solid #e5e5e5;
        }

        /* Pantay lahat sa kaliwa: walang left padding sa unang column */
        table.data th:first-child,
        table.data td:first-child {
            padding-left: 0;
        }

        table.data tr.total td {
            font-weight: bold;
        }

        .text-right { text-align: right; }
        .empty { text-align: center; font-style: italic; color: #969696; }

        /* ========= Highlights / definitions ======= */
        ul.notes {
            margin: 2px 0 8px 16px;
            padding: 0;
        }

        ul.notes li {
            font-size: 9.5px;
            color: #444444;
            margin-bottom: 3px;
        }

        .definitions {
            padding: 7px 10px;
            margin-top: 12px;
        }

        .definitions p {
            font-size: 8.5px;
            color: #737373;
            margin: 2px 0;
        }

        .footer {
            text-align: center;
            font-size: 8px;
            color: #969696;
            border-top: 0.5px solid #e5e5e5;
            padding-top: 4px;
        }

        .spacer { height: 20px; }
        .section-index { font-size:8px; font-weight:bold; letter-spacing:1px; color:#777777; margin:20px 0 5px; border-top:1px solid #303030; padding-top:10px; -pdf-keep-with-next:true; }
        .report-scope { font-size:9px; color:#6a6a6a; line-height:1.6; margin:0 0 14px; }
        .muted { font-size:8px; color:#737373; line-height:1.5; }
        .appendix-start { page-break-before:always; }
    </style>
</head>
<body>
    <div id="footerContent" class="footer">
        Balloorina - Confidential Analytics Report | For Administrative Use Only | Page <pdf:pagenumber> of <pdf:pagecount>
    </div>

    {% include 'admin/analytics/_pdf_body.html' %}
</body>
</html>
