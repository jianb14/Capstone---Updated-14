{% if u != request.user and not u.deleted_at %}{% if u.role == 'admin' or u.role == 'customer' %}
<button type="button" class="um-access-toggle {% if button_text %}ac-button{% else %}ac-icon-btn{% endif %} {% if u.is_active %}um-access-danger{% else %}um-access-success{% endif %}" data-user-id="{{ u.pk }}" data-user-name="{{ u.get_full_name|default:u.username }}" data-user-email="{{ u.email }}" data-user-active="{{ u.is_active|yesno:'1,0' }}" data-action-url="{% url 'admin_user_toggle' u.pk %}" aria-label="{% if u.is_active %}Deactivate{% else %}Activate{% endif %} user #USER-{{ u.pk }}" title="{% if u.is_active %}Deactivate{% else %}Activate{% endif %} account">{% if u.is_active %}{% include 'admin/user/_icon.html' with icon='ban' %}{% else %}{% include 'admin/user/_icon.html' with icon='check' %}{% endif %}{% if button_text %}{% if u.is_active %}Deactivate account{% else %}Activate account{% endif %}{% endif %}</button>
{% endif %}{% endif %}
