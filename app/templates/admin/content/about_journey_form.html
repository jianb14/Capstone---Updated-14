{% extends 'admin/admin_base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/admin_content.css' %}">

<div class="page-header">
    <h1>{{ action }} Journey Step</h1>
    <div class="breadcrumb">
        <a href="{% url 'admin_about_content' %}">About Page</a>
        <span class="separator">/</span>
        <span>{{ action }}</span>
    </div>
</div>

<div class="form-container">
    <form method="POST" class="form-card" id="journeyForm" novalidate>
        {% csrf_token %}

        <div class="form-grid">
            <div class="form-group">
                <label>Caption (small text under the big number)</label>
                <input type="text" name="caption" id="caption"
                    value="{% if journey_item.caption %}{{ journey_item.caption }}{% elif post_data.caption %}{{ post_data.caption }}{% endif %}"
                    placeholder="e.g. The Beginning">
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" id="title"
                    value="{% if journey_item.title %}{{ journey_item.title }}{% elif post_data.title %}{{ post_data.title }}{% endif %}"
                    placeholder="e.g. Every celebration starts with a spark." required>
                <p class="field-error" data-error-for="title"></p>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" id="description" rows="6"
                    placeholder="Enter journey step description...">{% if journey_item.description %}{{ journey_item.description }}{% elif post_data.description %}{{ post_data.description }}{% endif %}</textarea>
            </div>

            <div class="form-group">
                <label>Display Order</label>
                <input type="number" name="display_order" id="display_order"
                    value="{% if journey_item.display_order %}{{ journey_item.display_order }}{% elif post_data.display_order %}{{ post_data.display_order }}{% else %}0{% endif %}"
                    placeholder="0">
                <small class="help-text">Only the first 4 active steps (by order) are shown on the page.</small>
            </div>

            <div class="form-group checkbox-group">
                <label for="is_active">Status</label>
                <label for="is_active" class="active-toggle-box">
                    <input type="checkbox" name="is_active" id="is_active" {% if journey_item.is_active or post_data.is_active == 'on' or action == 'Create' %}checked{% endif %}>
                    <span>Active (Show on about page)</span>
                </label>
            </div>
        </div>

        <div class="form-actions">
            <a href="{% url 'admin_about_content' %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Journey Step</button>
        </div>
    </form>
</div>
{% endblock %}
