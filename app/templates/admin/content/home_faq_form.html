{% extends 'admin/admin_base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/admin_content.css' %}">

<div class="page-header">
    <h1>{{ action }} FAQ Item</h1>
    <div class="breadcrumb">
        <a href="{% url 'admin_home_content' %}">Home Page</a>
        <span class="separator">/</span>
        <span>{{ action }}</span>
    </div>
</div>

<div class="form-container">
    <form method="POST" class="form-card" id="faqForm" novalidate>
        {% csrf_token %}

        <div class="form-grid">
            <div class="form-group">
                <label>Question</label>
                <input type="text" name="question" id="question"
                    value="{% if faq.question %}{{ faq.question }}{% elif post_data.question %}{{ post_data.question }}{% endif %}"
                    placeholder="e.g. How far in advance should I book?" required>
                <p class="field-error" data-error-for="question"></p>
            </div>

            <div class="form-group">
                <label>Answer</label>
                <textarea name="answer" id="answer" rows="6"
                    placeholder="Enter the answer...">{% if faq.answer %}{{ faq.answer }}{% elif post_data.answer %}{{ post_data.answer }}{% endif %}</textarea>
            </div>

            <div class="form-group">
                <label>Display Order</label>
                <input type="number" name="display_order" id="display_order"
                    value="{% if faq.display_order %}{{ faq.display_order }}{% elif post_data.display_order %}{{ post_data.display_order }}{% else %}0{% endif %}"
                    placeholder="0">
            </div>

            <div class="form-group checkbox-group">
                <label for="is_active">Status</label>
                <label for="is_active" class="active-toggle-box">
                    <input type="checkbox" name="is_active" id="is_active" {% if faq.is_active or post_data.is_active == 'on' or action == 'Create' %}checked{% endif %}>
                    <span>Active (Show on home page)</span>
                </label>
            </div>
        </div>

        <div class="form-actions">
            <a href="{% url 'admin_home_content' %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save FAQ</button>
        </div>
    </form>
</div>
{% endblock %}
