<div class="ar-kpis">{% for kpi in kpis %}
  <article class="ac-kpi ar-kpi ar-accent-{{ kpi.accent }}" data-kpi="{{ kpi.key }}" style="--ar-order:{{ forloop.counter0 }}">
    <div class="ac-kpi-head"><span>{{ kpi.label }}</span>{% include 'admin/dashboard/_icon.html' with icon=kpi.icon %}</div>
    <strong>{{ kpi.value }}</strong><p>{{ kpi.note }}</p>
    {% if kpi.delta %}<div class="ar-delta">{% if kpi.delta.direction == 'up' %}↗{% elif kpi.delta.direction == 'down' %}↘{% else %}—{% endif %} {{ kpi.delta.text }}</div>{% endif %}
  </article>
{% endfor %}</div>
