{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme-effect="radial" data-admin-shell>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - Balloorina{% endblock %}</title>
    <script src="{% static 'js/admin_sidebar.js' %}?v=20261026b"></script>
    <script src="{% static 'js/account_pages.js' %}?v=20261025a"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Base CSS -->
    <link rel="stylesheet" href="{% static 'css/admin_base.css' %}?v=20261017a">

    {% block extra_css %}{% endblock %}
    
    <!-- Theme Toggle -->
    <link rel="stylesheet" href="{% static 'css/admin_light_mode.css' %}?v=20261017a">
    <link rel="stylesheet" href="{% static 'css/theme_controls.css' %}?v=20261026b">
    <link rel="stylesheet" href="{% static 'css/customer_notifications.css' %}?v=20261026b">
    <link rel="stylesheet" href="{% static 'css/account_menu.css' %}?v=20261026b">
    <link rel="stylesheet" href="{% static 'css/admin_header.css' %}?v=20261026e">
    <link rel="stylesheet" href="{% static 'css/admin_navigation.css' %}?v=20261026a">
    <link rel="stylesheet" href="{% static 'css/admin_sidebar.css' %}?v=20261026c">
    <link rel="stylesheet" href="{% static 'css/page_background.css' %}?v=20261026a">
    <script src="{% static 'js/theme-toggle.js' %}?v=20261026a"></script>
</head>

<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Include Navbar/Sidebar -->
    {% include 'components/admin_navbar.html' %}

    <!-- Main Content -->
    <main class="main-content">
        {% include 'components/admin_topbar.html' %}

        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- JavaScript -->
    <script src="{% static 'js/customer_notifications.js' %}?v=20261026e"></script>
    <script src="{% static 'js/account_menu.js' %}?v=20261026b"></script>
    <script src="{% static 'js/admin_navigation.js' %}?v=20261026a"></script>
    <script>window.AdminSidebar?.mount();</script>

    {% block extra_js %}{% endblock %}

    <!-- SweetAlert2 & Global Messages Handler -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 4000,
                timerProgressBar: true,
                background: '#1a1a1a',
                color: '#fff',
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });

            {% if messages %}
                {% for message in messages %}
                    const messageType = '{{ message.tags|escapejs }}' === 'error' ? 'error' : ('{{ message.tags|escapejs }}' === 'success' ? 'success' : 'info');
                    const messageText = '{{ message|escapejs }}';
                    const isLoginSuccess = messageType === 'success' && messageText.toLowerCase().includes('login successful');
                    Toast.fire({
                        icon: messageType,
                        title: messageText,
                        timer: isLoginSuccess ? 1500 : 4000
                    });
                {% endfor %}
            {% endif %}

            document.addEventListener('click', function (event) {
                const trigger = event.target.closest('a[data-swal-confirm="true"]');
                if (!trigger) return;

                event.preventDefault();

                const title = trigger.getAttribute('data-swal-title') || 'Delete this item?';
                const text = trigger.getAttribute('data-swal-text') || 'This action cannot be undone.';
                const confirmText = trigger.getAttribute('data-swal-confirm-text') || 'Yes, delete it';
                const cancelText = trigger.getAttribute('data-swal-cancel-text') || 'Cancel';
                const href = trigger.getAttribute('href');

                Swal.fire({
                    title: title,
                    text: text,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: confirmText,
                    cancelButtonText: cancelText,
                    reverseButtons: true,
                    focusCancel: true,
                    background: '#131313',
                    color: '#ffffff',
                    confirmButtonColor: '#dc2626',
                    cancelButtonColor: '#374151'
                }).then((result) => {
                    if (result.isConfirmed && href) {
                        window.location.href = href;
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                        Toast.fire({
                            icon: 'info',
                            title: 'Deletion cancelled',
                            timer: 1600
                        });
                    }
                });
            });
        });
    </script>
</body>

</html>
