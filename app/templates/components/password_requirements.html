<div class="password-requirements" id="{{ requirements_id }}" aria-live="polite" aria-atomic="false">
    <p class="password-requirements-title">Password requirements</p>
    <ul class="password-requirements-list">
        <li id="{{ rule_prefix }}length" class="password-rule"><span class="password-rule-icon" aria-hidden="true"></span><span class="password-rule-status">Not met: </span><span>8+ characters</span></li>
        <li id="{{ rule_prefix }}uppercase" class="password-rule"><span class="password-rule-icon" aria-hidden="true"></span><span class="password-rule-status">Not met: </span><span>Uppercase letter</span></li>
        <li id="{{ rule_prefix }}number" class="password-rule"><span class="password-rule-icon" aria-hidden="true"></span><span class="password-rule-status">Not met: </span><span>Number</span></li>
        <li id="{{ rule_prefix }}special" class="password-rule"><span class="password-rule-icon" aria-hidden="true"></span><span class="password-rule-status">Not met: </span><span>Special character</span></li>
    </ul>
</div>
