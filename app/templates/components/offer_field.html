<div class="oe-field{% if wide %} oe-field-wide{% endif %}{% if field.errors %} oe-field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="oe-required-mark" aria-label="required">*</span>{% endif %}</label>
    {{ field }}
    <div class="oe-field-error" id="error_{{ field.name }}">{{ field.errors }}</div>
</div>
