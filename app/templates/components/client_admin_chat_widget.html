{% load static %}
<div class="admin-chat-float sc-workspace sc-client" id="adminChatWidget" data-support-chat data-mode="client" data-user="{{ user.pk }}"
     data-state-url="{% url 'support_state' %}" data-send-url="{% url 'support_send' %}"
     data-action-url="{% url 'support_action' %}" data-csrf="{{ csrf_token }}">
    {% include 'components/support_chat_icons.html' %}
    <button type="button" class="admin-chat-toggle" id="adminChatToggle" aria-label="Chat with admin" aria-expanded="false" aria-controls="adminChatPanel">
        <svg aria-hidden="true"><use href="#sc-headset"/></svg><span class="sc-fab-badge" data-unread-badge hidden>0</span>
    </button>
    {% include 'components/support_chat_panel.html' %}
</div>
<script src="{% static 'js/support_chat.js' %}?v=20261028b" defer></script>
