<div id="adminGlobalSearch" class="admin-global-search" data-search-url="{% url 'admin_global_search' %}">
    <form action="{% url 'admin_booking_list' %}" method="get" role="search" aria-label="Search admin records" class="admin-search-form">
        <svg class="admin-search-magnifier" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>
        <input id="adminSearchInput" type="search" name="search" maxlength="120" placeholder="Search bookings, customers, payments…" aria-label="Search admin records" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="adminSearchResults" autocomplete="off" spellcheck="false">
        <button type="button" class="admin-search-clear" aria-label="Clear global search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <button type="button" class="admin-search-close" aria-label="Close global search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </form>
    <section class="admin-search-popup" aria-label="Admin search suggestions" hidden>
        <div class="admin-search-status" role="status" aria-live="polite"></div>
        <div id="adminSearchResults" role="listbox" aria-label="Matching admin records"></div>
        <div class="admin-search-footer" hidden>Top matches · Refine your search for more specific results.</div>
    </section>
</div>
