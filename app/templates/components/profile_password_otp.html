<dialog id="profilePasswordOtpDialog" class="profile-dialog password-otp-dialog" aria-labelledby="profileOtpTitle" data-endpoint="{% url 'verify_change_password_otp' %}">
    <header class="profile-dialog__header"><div><h2 id="profileOtpTitle">Verify your password change</h2><p>Enter the code sent to <span data-profile-otp-email>your email</span>.</p></div><button type="button" class="profile-dialog__close" data-profile-otp-close aria-label="Close password verification">{% include 'components/review_close_icon.html' %}</button></header>
    <form id="profilePasswordOtpForm" class="profile-dialog__form" novalidate>{% csrf_token %}
        <div class="profile-dialog__fields"><p class="profile-dialog__note">Your password stays the same until you verify this code.</p><p id="profileOtpFeedback" class="profile-dialog__message" role="status" tabindex="-1" hidden></p><div class="form-group"><label for="profileOtpCode">Email verification code</label><input id="profileOtpCode" class="profile-otp-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6" aria-describedby="profileOtpFeedback"></div><button id="profileOtpResend" class="deletion-resend" type="button" disabled>Resend code</button></div>
        <footer class="profile-dialog__actions"><button type="button" class="profile-dialog__cancel" data-profile-otp-close>Close</button><button id="profileOtpSubmit" type="submit" class="profile-dialog__submit" disabled>Verify &amp; change password</button></footer>
    </form>
</dialog>
