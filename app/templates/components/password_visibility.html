<button type="button" class="password-visibility-toggle" data-password-target="{{ input_id }}" data-password-label="{{ password_label|default:'password' }}" aria-controls="{{ input_id }}" aria-label="Show {{ password_label|default:'password' }}" aria-pressed="false">
    <svg class="password-visibility-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="password-visibility-hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a20.6 20.6 0 0 1-3 3.9M6.2 6.2A22.5 22.5 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.8-1.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    </svg>
</button>
