<div class="review-options">
    <button class="options-btn review-icon-button" type="button" onclick="toggleReviewDropdown(event, {{ review.id }})" aria-label="Review options" aria-expanded="false" aria-controls="dropdown-{{ review.id }}" aria-haspopup="menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
    <div id="dropdown-{{ review.id }}" class="review-dropdown" role="menu" aria-label="Review actions">
        <button type="button" role="menuitem" onclick="openEditModal({{ review.id }}, {{ review.rating }}, '{{ review.comment|escapejs }}', '{{ review.images_json|escapejs }}')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6L16 3ZM14 5l5 5"/></svg>Edit review
        </button>
        <button type="button" role="menuitem" class="delete-opt" onclick="ReviewUI.closeMenus(); deleteReview({{ review.id }})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>Delete review
        </button>
    </div>
</div>
