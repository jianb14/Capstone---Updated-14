<div class="review-empty-state"{% if state_id %} id="{{ state_id }}"{% endif %}{% if initially_hidden %} hidden{% endif %}>
    <div class="review-empty-state__icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            {% if kind == 'pending' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5 3 3 5-5"/>
            {% elif kind == 'filtered' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 10.5h5"/>
            {% else %}<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>{% endif %}
        </svg>
    </div>
    <h3>{{ title }}</h3>
    <p>{{ subtitle }}</p>
    {% if clear_filters %}<button type="button" class="review-empty-state__button" data-clear-review-filters>Clear filters</button>{% endif %}
    {% if review_link %}<a class="review-empty-state__button" href="{% url 'my_reviews' %}">Write a review</a>{% endif %}
</div>
