<aside class="account-sidebar" aria-label="Account navigation">
    <div class="account-sidebar-identity">
        <span class="account-sidebar-avatar" aria-hidden="true">{{ user.first_name|default:user.username|slice:':1'|upper }}</span>
        <div><strong data-account-name>{{ user.get_full_name|default:user.username }}</strong><span data-account-email>{{ user.email }}</span></div>
    </div>
    <div class="account-sidebar-links" id="accountSidebarLinks">
        <p class="account-sidebar-label">Your account</p>
        <a href="{% url 'my_profile' %}" data-account-link data-account-key="my_profile" {% if request.resolver_match.url_name == 'my_profile' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span>My Profile</span></a>
        <a href="{% url 'customer_profile' %}" data-account-link data-account-key="customer_profile" {% if request.resolver_match.url_name == 'customer_profile' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg><span>My Bookings</span></a>
        <a href="{% url 'my_payments' %}" data-account-link data-account-key="my_payments" {% if request.resolver_match.url_name == 'my_payments' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20m-15 5h4"/></svg><span>My Payments</span></a>
        <a href="{% url 'my_reviews' %}" data-account-link data-account-key="my_reviews" {% if request.resolver_match.url_name == 'my_reviews' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span>My Reviews</span></a>
        <div class="account-sidebar-separator"></div>
        <a href="{% url 'report_concern' %}" data-account-link data-account-key="report_concern" {% if request.resolver_match.url_name == 'report_concern' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg><span>Report Concern</span></a>
        <a href="{% url 'logout' %}" class="account-sidebar-logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5m5-13 5 5-5 5m-6-5h13"/></svg><span>Log Out</span></a>
    </div>
</aside>
