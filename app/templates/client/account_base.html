{% extends 'client/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account_workspace.css' %}?v=20261026b">
<link rel="stylesheet" href="{% static 'css/account_ui.css' %}?v=20261026g">
<script src="{% static 'js/account_tables.js' %}?v=20261026b" defer></script>
<script src="{% static 'js/account_motion.js' %}?v=20261025a" defer></script>
<script src="{% static 'js/account_forms.js' %}?v=20261025a" defer></script>
{% block account_css %}{% endblock %}
{% endblock %}
{% block content %}
<div class="account-workspace" data-account-shell>
    {% include 'components/account_sidebar.html' %}
    <div class="account-content-wrap">
        <p class="account-navigation-status" role="status" aria-live="polite" hidden></p>
        <main id="accountContent" class="account-content" data-account-page="{% block account_page %}{% endblock %}" tabindex="-1" aria-label="Account content">
            {% block account_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
