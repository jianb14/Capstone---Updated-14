<div id="bookingModal" class="modal-overlay customer-booking-modal" role="dialog" aria-modal="true" aria-labelledby="bookingDetailsTitle" data-content-url="{% url 'booking_modal_content' 0 %}">
    <div class="modal-card customer-booking-card" tabindex="-1">
        <header class="customer-booking-header">
            <div><h2 id="bookingDetailsTitle">Booking Details</h2><span class="booking-dialog-id"></span></div>
            <button type="button" class="booking-dialog-close" data-booking-close aria-label="Close booking details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="customer-booking-content" aria-live="polite"></div>
    </div>
    <dialog id="bookingReferenceDialog" class="booking-reference-viewer" aria-labelledby="bookingReferenceTitle">
        <header><h2 id="bookingReferenceTitle">Image preview</h2><button type="button" class="booking-dialog-close" data-reference-close aria-label="Close image preview" autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
        <div class="booking-reference-viewer-body"><img alt=""><p data-reference-error role="alert" hidden>This image could not be loaded. Close this preview and try again.</p></div>
    </dialog>
</div>
<div id="eventDesignModal" class="modal-overlay customer-booking-modal" role="dialog" aria-modal="true" aria-labelledby="eventDesignTitle">
    <div class="modal-card customer-booking-card customer-design-card" tabindex="-1">
        <header class="customer-booking-header">
            <div><h2 id="eventDesignTitle">Your Event Design</h2><span class="booking-dialog-id"></span></div>
            <button type="button" class="booking-dialog-close" data-booking-close aria-label="Close event design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="customer-booking-content" aria-live="polite"></div>
    </div>
</div>
