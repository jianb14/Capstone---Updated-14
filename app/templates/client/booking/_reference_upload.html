<input type="file" id="{{ input_id }}" accept="image/*" multiple class="file-input reference-file-control" tabindex="-1" aria-label="Choose reference pictures">
<div class="reference-dropzone" data-file-input="{{ input_id }}" role="group" aria-label="Reference picture upload">
    <i class="far fa-cloud-arrow-up" aria-hidden="true"></i>
    <strong>Choose images or drag &amp; drop them here</strong>
    <span>Images only &middot; Up to 4 reference pictures in total</span>
    <button type="button" class="reference-browse" aria-controls="{{ input_id }}">Browse Files</button>
    <small class="reference-upload-status" aria-live="polite"></small>
</div>
