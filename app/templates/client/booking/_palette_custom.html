<div class="design-palette-custom">
    <label class="custom-color-control" for="{{ color_id }}">
        <input type="color" id="{{ color_id }}" value="#d4b896" title="Pick a custom color" aria-label="Pick a custom color">
        <span>Custom color</span>
    </label>
    <button type="button" id="{{ button_id }}" class="palette-add-btn">Add color</button>
    <span id="{{ selected_id }}" class="palette-selected" aria-live="polite">0 of 3 colors selected</span>
</div>
